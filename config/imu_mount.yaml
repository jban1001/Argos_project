# ARGOS IMU 장착 위치 (base_link -> imu_link)
#
# 하드웨어 (2026-08-26 실측)
# --------------------------
#   MPU6050 (실제로는 MPU-6500 계열 호환 다이, WHO_AM_I = 0x72)
#   Jetson Orin Nano 40핀 헤더 27(SDA) / 28(SCL) = /dev/i2c-1, 주소 0x68
#
# 자세 근거
# ---------
#   정지 상태 accel 평균 (7초, 590 표본)
#       x = -0.7311 m/s^2
#       y = +0.0963 m/s^2
#       z = +10.2347 m/s^2      <- 양수. 칩 윗면이 하늘을 향한다.
#
#   |a| = 10.26 m/s^2 로 중력 9.807 보다 4.6% 크다.
#   클론 다이의 가속도 스케일 오차이며, linear acceleration 을
#   EKF 에 넣지 않으므로 무해하다. 기울기 계산에만 영향을 준다.
#
#   기울기 = asin(-0.7311 / 10.26) = -4.09 deg
#   즉 보드가 약 4 도 기울어 장착돼 있다.
#
# 왜 roll/pitch 를 0 으로 두는가
# ------------------------------
#   실측 4 도는 보드 자체의 기울기와 가속도계 자체 bias 가 섞인 값이라
#   이것만으로 장착 기울기를 단정할 수 없다.
#   초기 EKF 는 angular_velocity.z 하나만 쓰고 two_d_mode 를 켜므로
#   roll/pitch 는 결과에 전혀 들어오지 않는다.
#   나중에 accel 을 융합하게 되면 그때 수평계로 다시 잰다.
#
# 왜 yaw 가 gyro z 에 영향을 주지 않는가
# --------------------------------------
#   IMU 의 +Z 가 base_link 의 +Z 와 같은 방향(둘 다 위)이므로
#   z 축 둘레의 회전 성분은 yaw 를 얼마로 두든 그대로 보존된다.
#   보드가 앞/뒤/좌/우 어디를 보든 angular_velocity.z 는 같다.
#
#   그래서 초기 융합에서는 yaw 값이 정확하지 않아도 안전하다.
#   다만 TF 트리를 물리적으로 정직하게 두기 위해,
#   그리고 나중에 accel 을 쓸 때를 위해 실측값으로 채우는 것이 옳다.
#
# TODO(하드웨어 실측 필요)
#   - x / y / z : base_link(좌우 구동륜 축 중심) 기준 자로 잴 것
#   - yaw       : 보드의 X축 화살표가 로봇 정면(+x)과 이루는 각
#                 정면이면 0, 왼쪽이면 +pi/2, 뒤면 pi, 오른쪽이면 -pi/2
#
#   아래 값은 "축 정렬만 맞춘" 잠정값이다.
#   회전 시험으로 gyro z 부호가 맞는 것은 확인했으나
#   위치는 아직 실측하지 않았다.
#
#   LiDAR 와 달리 IMU 는 각속도만 쓰므로 위치 오차가
#   초기 EKF 결과를 바꾸지 않는다. 그래도 기록은 남긴다.

base_link_to_imu:
  x: 0.0
  y: 0.0
  z: 0.0

  roll: 0.0
  pitch: 0.0
  yaw: 0.0
