# ARGOS Nav2 파라미터
#
# /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml 를 기반으로
# ARGOS 실측값에 맞춰 수정한 것이다.
#
# ARGOS 실측 제원 (2026-08-20)
#   차체        : 길이(x) 0.28 m, 폭(y) 0.53 m   <- 폭이 길이의 약 2배
#   footprint   : base_link 를 차체 중심으로 가정
#   외접반경    : sqrt(0.14^2 + 0.265^2) = 0.30 m  -> 제자리 회전에 지름 0.6 m 필요
#   내접반경    : 0.14 m
#   최대 속도   : 직진 0.158 m/s, 제자리 회전 0.637 rad/s (PWM 120 실측)
#   구동 방식   : differential / skid-steer, 제자리 회전 가능
#   IMU         : 없음
#
# TODO(실측 필요)
#   - base_link(구동륜 축 중심)가 차체 앞뒤 정중앙이라고 가정했다.
#     실제로 치우쳐 있으면 footprint 의 x 값을 그만큼 옮길 것.
#   - 가감속 한계는 측정하지 않았다. velocity_smoother 값은 보수적 추정치다.
#
# AMCL 은 이 파일이 아니라 config/amcl.yaml 에 있다.

bt_navigator:
  ros__parameters:
    transform_tolerance: 1.0
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # LiDAR 가 3.7~11.8 Hz 로 느려서 20 Hz 는 의미가 없다.
    # Jetson 부하로 10 Hz 도 못 맞춰 경고가 났으므로 8 Hz 로 낮춘다.
    controller_frequency: 8.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 최고 속도가 0.158 m/s 라 기본값(0.5 m / 10 s)은 빠듯하다
      required_movement_radius: 0.25
      movement_time_allowance: 20.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    FollowPath:
      # Phase J: 우선 Regulated Pure Pursuit 로 시작한다.
      # 동적 장애물 회피가 필요해지면 MPPI(DiffDrive 모델)로 교체.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # 실측 최대 0.158 m/s. 여유를 두고 0.12 로 운용한다.
      desired_linear_vel: 0.12
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.4

      # 로봇이 작고 느리므로 lookahead 도 짧게
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true

      # 느린 LiDAR 때문에 TF 가 늦게 들어온다. 여유를 크게.
      transform_tolerance: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5

      # 곡률/장애물 근접 시 감속
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.04

      # ARGOS 는 제자리 회전이 가능하므로 경로 시작 시 방향부터 맞춘다.
      # 주의: use_rotate_to_heading 와 allow_reversing 은 동시에 못 쓴다.
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.0

      max_robot_pose_search_dist: 5.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.35
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      transform_tolerance: 1.0
      width: 3
      height: 3
      resolution: 0.05
      # ARGOS 는 원형이 아니다. 폭이 길이의 약 2배라 robot_radius 로는 표현 불가.
      footprint: "[[-0.14, -0.265], [-0.14, 0.265], [0.14, 0.265], [0.14, -0.265]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 외접반경 0.30 m 보다 커야 회전 시 충돌을 막는다
        inflation_radius: 0.45
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # LiDAR 실측 신뢰 범위 기준
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 1.0
      footprint: "[[-0.14, -0.265], [-0.14, 0.265], [0.14, 0.265], [0.14, -0.265]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # State Lattice 는 NavFn 보다 훨씬 무겁다. 20 Hz 를 기대하면 경고만 쏟아진다.
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 2.0
    GridBased:
      # ARGOS 는 differential/skid-steer 이고 제자리 회전이 가능하다.
      # Hybrid A* 대신 State Lattice 를 쓰는 이유:
      #   (x, y, theta) 기반이고, 로봇이 실제로 수행 가능한
      #   motion primitive 만으로 경로를 만든다.
      plugin: "nav2_smac_planner::SmacPlannerLattice"

      # nav2_smac_planner 가 제공하는 diff 모델 lattice 를 프로젝트로 복사한 것.
      #   motion_model = diff, grid_resolution = 0.05 (맵 해상도와 일치)
      #   num_of_headings = 16, primitive 112개
      #   제자리 회전 primitive 32개 포함
      lattice_filepath: "/home/odyssey/argos_project/config/argos_lattice.json"

      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false

      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 2.0
      retrospective_penalty: 0.015

      # 후진 primitive 를 쓰려면 true 로 바꾼다.
      # 다만 현재 컨트롤러(RPP)는 use_rotate_to_heading: true 라
      # 후진 경로를 따라갈 수 없다. 후진이 필요하면
      # RPP 의 allow_reversing 을 켜고 use_rotate_to_heading 을 끄거나
      # MPPI 로 교체해야 한다.
      allow_reverse_expansion: false

      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    # ARGOS 실측 최대 제자리 회전 0.637 rad/s. 기본값 1.0 은 낼 수 없는 값이다.
    max_rotational_vel: 0.45
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # 실측 최대: 직진 0.158 m/s, 제자리 회전 0.637 rad/s
    max_velocity: [0.15, 0.0, 0.6]
    min_velocity: [-0.15, 0.0, -0.6]
    # TODO: 가감속 한계는 아직 측정하지 않았다. 보수적 추정치.
    max_accel: [0.3, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# collision_monitor / docking_server / loopback_simulator 는
# 현재 단계에서 사용하지 않으므로 제거했다.
# 필요해지면 nav2_bringup 의 nav2_params.yaml 에서 다시 가져올 것.
