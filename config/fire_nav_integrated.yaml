# ARGOS Nav2 순찰 + 화재 접근 (인지 결과는 토픽으로만 받는다)
#
# 인지팀 원본 ~/YOLO/new_main_robot_map.py 는 수정하지 않는다.
# YOLO / 카메라 / 아두이노 / MLP / 텔레그램은 전부 fire_perception_main.py
# 프로세스가 소유한다. 이 노드는 결과만 구독한다.
#
# 텔레그램 쿨다운(기본 30초)은 런처 쪽 파라미터다.
#   ~/.venv/bin/python fire_perception_main.py --ros-args \
#       -p telegram_cooldown_seconds:=30.0

argos_fire_nav:
  ros__parameters:

    # ---- 인지 토픽 ----
    detection_topic: /argos/fire_detection

    # 이 시간 동안 새 결과가 없으면 "인지 끊김" 으로 본다.
    # 프레임 단위 판단이 아니라 프로세스 생존 확인 용도다.
    # 원본은 화재 확정 순간 텔레그램 사진과 지도 PNG 를 메인 루프 안에서
    # 동기로 만들기 때문에 수백 ms 발행이 멎는다. 그래서 넉넉히 잡는다.
    detection_timeout: 1.5

    # ---- 카메라 기하 ----
    # 방위각 = -norm_x * HFOV/2 + yaw_offset
    # 화면 오른쪽(+)이 로봇 기준 시계방향(-)이다.
    # ★ 젯슨에서 제일 먼저 실측할 항목. 불을 화면 오른쪽에 두고
    #   로봇이 오른쪽으로 도는지 확인한다. 반대로 돌면 부호 문제다.
    camera_hfov_deg: 60.0
    camera_yaw_offset_deg: 0.0
    # +1.0 이 맞다는 것은 fire_seeker.py 현장 시험에서 확인되었다.
    # ("왼쪽에 있는 불을 보면 왼쪽으로 돈다". 계산식과 제어법이 동일하다)
    # 카메라를 다시 장착했을 때만 재확인하면 된다. 확인 방법은
    # fire_nav_integrated.py 맨 위 "방위각 부호" 항목 참고.
    bearing_sign: 1.0

    # ---- 클래스별 방위각 근거 최소 confidence ----
    # 인지팀의 화면 표시 기준(DISPLAY_CONF)과 완전히 분리되어 있다.
    # 원본은 conf 0.01 이상 전부를 그대로 발행하므로 여기서 자유롭게 정한다.
    bearing_conf_fire: 0.10
    bearing_conf_smoke: 0.25
    # spark 는 오탐 박스가 많아 높게 잡는다.
    bearing_conf_spark: 0.60
    # 담배꽁초는 방향 근거로 쓰지 않는다.
    bearing_conf_cigarette_butt: 0.99

    # 앞에 있는 클래스부터 방위각 근거로 쓴다.
    bearing_priority: ["fire", "smoke", "spark"]

    # ---- 화재 확정 ----
    # 접근은 반드시 화면에 실제 fire bbox 가 있어야 시작한다.
    # MLP 확률만으로는 움직이지 않는다 (현재 recall 이 약 0.25).
    # 접근을 시작하는 기준. 이 값을 confirm_seconds 동안 계속 넘어야 한다.
    # 순간적으로 튀는 값으로는 움직이지 않는다.
    # 0.20 은 너무 민감해서 0.35 로 올렸다. 더 보수적으로 가려면 0.45.
    fire_conf: 0.35
    confirm_seconds: 1.0
    bearing_hold_seconds: 1.2
    lost_seconds: 2.0
    hold_release_seconds: 5.0

    # ---- 텔레그램 전송 후 출발 ----
    #   sent      정상 전송된 뒤에 출발 (기본)
    #   attempted 전송을 시도한 뒤에 출발 (실패 포함)
    #   none      기다리지 않는다
    #
    # 원본 알림 조건은 센서 연결 + MLP >= 0.70 + 쿨다운이다.
    # MLP 는 precision 1.000 / recall 0.667 (2026-08-25 재학습).
    # 오경보는 없지만 위험 상황의 약 1/3 은 알림이 나가지 않는다.
    # 그래서 아래 타임아웃과 alert_skip_grace 가 필요하다.
    #
    # ★ 원본 BOT_TOKEN 이 "--" 인 동안에는 전송이 항상 실패한다.
    #   토큰을 채우기 전까지 테스트하려면 attempted 로 두는 게 편하다.
    alert_gate: sent
    alert_wait_timeout: 10.0

    # 인지가 "이번 화재는 알림 대상이 아니다" 라고 알려주면 (MLP 미달 /
    # 센서 끊김 / 60초 쿨다운) 위 10초를 다 기다리지 않고 이 시간만 지나면
    # 바로 출발한다. 원본의 연속 확인 1초와 확률 흔들림을 흡수할 여유다.
    alert_skip_grace: 1.5

    # ---- 불이 아닌 위험 (담배꽁초 / 연기 등) ----
    # 원본 MLP 는 fire / smoke / cigarette_butt / spark 를 하나의 위험
    # 확률로 합쳐서 낸다. 그 판정이 서면 로봇도 멈춰서 알림이 나가게 하고,
    # 전송이 끝나면 접근하지 않고 순찰로 돌아간다.
    danger_stop_enabled: true
    # 재개 후 이 시간 동안은 같은 위험으로 다시 멈추지 않는다.
    # 원본 텔레그램 쿨다운(아래 런처 설정)과 같게 두는 것이 자연스럽다.
    danger_stop_cooldown: 30.0

    # 사용자가 RViz 에서 2D Pose Estimate 를 한 뒤에만 순찰한다.
    require_initial_pose: true

    # ---- 자동 순찰 목표 선택 ----
    patrol_min_radius: 0.8
    patrol_max_radius: 2.5
    # 차체 외접반경(약 0.30 m)보다 조금 크게. 실제 경로 충돌 검사는
    # Nav2 global/local costmap 이 다시 수행한다.
    patrol_clearance: 0.35
    patrol_goal_timeout: 75.0
    patrol_retry_delay: 1.5
    patrol_sample_attempts: 120
    patrol_free_max: 10

    # ---- 화재 접근 ----
    fire_stop_pause: 0.7
    align_tolerance_deg: 8.0
    realign_deg: 26.0
    turn_kp: 1.2
    align_w_max: 0.35
    approach_v: 0.08
    approach_w_max: 0.25
    fire_stop_dist: 0.60
    approach_max_seconds: 25.0

    # ---- LiDAR / 속도 중재 ----
    scan_timeout: 1.5
    front_half_angle_deg: 25.0
    nav_cmd_timeout: 0.50
    fire_cmd_timeout: 0.30
    mux_rate: 20.0

    # ---- 토픽 ----
    nav_cmd_topic: /cmd_vel_nav_auto
    fire_cmd_topic: /cmd_vel_fire
    output_cmd_topic: /cmd_vel_nav
    map_topic: /map
    pose_topic: /amcl_pose
    initial_pose_topic: /initialpose
    scan_topic: /scan
