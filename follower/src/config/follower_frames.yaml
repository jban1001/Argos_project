# 팔로워의 좌표계 사슬. 팔로워에는 URDF 가 없으므로 여기가 유일한 출처다.
#
#   follower_base_link -> follower_imu_link -> follower_camera
#
# 왜 base_link 가 필요한가
# ------------------------
# spec section 16 의 연쇄는 T_F_C (base_link -> 카메라) 를 쓴다. cam_imu.yaml
# 은 IMU -> 카메라만 주므로 base_link -> IMU 가 있어야 합성된다.
#
# "IMU 를 그냥 원점으로 삼으면 되지 않나" 는 성립하지 않는다. 차동구동 로봇의
# 회전 중심은 두 바퀴 축의 중점이고, 궤적 추종은 그 점을 기준으로 조향한다.
# IMU 가 그 점에서 떨어져 있으면 제자리 회전에도 IMU 는 원을 그린다.

follower_frames:
  base_link: follower_base_link
  imu: follower_imu_link
  camera: follower_camera
  odom: follower_odom

  # base_link -> IMU. 로봇 좌표 규약: x 정면, y 좌측, z 위.
  # base_link 원점은 두 바퀴 축의 중점, 높이는 바퀴 축 중심.
  #
  # 재는 법: 바퀴 축 중점에서 MPU6050 칩 중심까지 자로 잰다. 세 축 모두.
  # 부호에 주의할 것 -- IMU 가 축 중점보다 뒤에 있으면 forward_m 은 음수다.
  # 독립 검증 (2026-08-27): 사슬이 예측하는 바퀴 축 중점 -> 카메라 렌즈는
  # 앞 11.5 / 좌 1.5 / 위 27.0 cm, 직선거리 29.4 cm 다. 줄자로 직접 재서
  # 일치함을 확인했다. IMU 를 거치지 않는 경로라, 아래 값이나 cam_imu.yaml
  # 병진 중 어느 쪽이 틀려도 이 검증에서 어긋난다.
  base_to_imu:
    forward_m: -0.0200
    left_m: 0.0150
    up_m: 0.0800

    # IMU 물리 축:  IMU x = 로봇 우측,  IMU y = 로봇 정면,  IMU z = 위.
    # 즉 IMU 프레임은 로봇 프레임을 z 축으로 약 -90 도 돌린 것이다.
    #
    # 정확히 -90 도는 아니다. scripts/27_check_imu_alignment.py 로 로봇을 손으로
    # 앞뒤로 밀면서 가속도가 IMU x/y 에 갈리는 비를 재면:
    #     1 회 +2.58 도 (직선성 3.7),  2 회 +3.01 도 (직선성 4.5)
    #     평균 +2.80 도, 퍼짐 0.43 도
    # 독립 반복이 0.43 도 안에서 일치하므로 계통 오차가 크지 않다. 재표본이
    # 아니라 다시 민 것이라서, 밀기가 삐뚤었다면 여기서 드러났을 것이다.
    #
    # 이 2.8 도는 병진 0.2331 m 에 대해 11.4 mm 를 움직인다 -- 자로 재는
    # 정밀도와 비슷한 크기라 버리지 않는다.
    #
    # 부수적으로 이 측정이 미해결이던 문제를 갈랐다: 광학흐름이 잰 12.5 도
    # 기울기는 IMU 가 아니라 **카메라** 것이다. IMU 는 2.8 도밖에 안 틀어져
    # 있으므로, 로봇 기준으로 잰 병진을 IMU 프레임으로 옮길 때는 카메라
    # 광학축이 아니라 이 각도를 써야 한다 (19 번 스크립트가 틀린 지점이다).
    yaw_deg: -87.20

  # IMU -> 카메라는 여기에 적지 않는다. config/cam_imu.yaml 이 유일한 출처이고,
  # 같은 값을 두 군데 두면 한쪽만 고쳐져서 조용히 갈라진다.
  imu_to_camera_from: config/cam_imu.yaml
