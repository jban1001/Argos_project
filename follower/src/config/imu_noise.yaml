# IMU noise model, measured by scripts/10_allan_variance.py
# 791696 samples over 66.1 min at 199.8 Hz
# Worst axis of each group; OpenVINS takes one value per group.
# The random-walk values are UPPER BOUNDS, not measurements: the
# +1/2 asymptote had not developed within the recording, so K was
# bounded by sigma(tau_max) * sqrt(3/tau_max). Safe for a filter,
# since overstating process noise only makes it less confident.
gyroscope_noise_density: 9.396689e-05
gyroscope_random_walk: 3.724670e-05
accelerometer_noise_density: 2.054875e-03
accelerometer_random_walk: 2.298782e-04

# === 실측값과 별개: VIO 에 넣을 때의 부풀림 계수 ===
#
# 위 네 값은 66.1 분 정지 녹화(791696 샘플)의 실측이다. 곱해서 덮어쓰지
# 말 것 -- 그러면 나중에 그 숫자가 잰 값인지 가정한 값인지 구분할 수 없다.
#
# 이번 측정에서 6 축 중 5 축이 +1/2 꼬리를 만들었다 (이전 60 초 기록에서는
# 하나도 없었다). 다만 OpenVINS 는 그룹당 한 값을 받으므로 가장 나쁜 축을
# 쓰고, 그 축들(gyro x, accel x)은 아직 꼬리가 덜 자랐다. 그래서 random_walk
# 는 여전히 상한이다.
#
# 게다가 녹화 중 보드 온도가 57 -> 68 도 움직였다 (같은 Pi 에서 테스트를
# 돌린 탓). MPU6050 바이어스 온도계수가 대략 0.03 deg/s/도 이므로 그 열
# 드리프트가 긴 tau 구간에 섞였다. 상한 방향이라 필터에는 안전하다.
#
# 왜 부풀리나
# ----------
# Allan 분산은 입력이 없는 상태의 센서 잡음 바닥을 잰다. 주행 중에는 모터와
# 바퀴 진동이 IMU 를 실제로 흔드는데, 그건 잡음이 아니라 진짜 신호다. 다만
# 카메라가 30 Hz 라 그 대역을 보지 못하므로, 추정기 입장에서는 잡음처럼
# 작동한다. 그래서 정지 측정값은 운용 중 유효 잡음의 하한이다.
#
# density 에만 건다
# -----------------
# 진동은 백색잡음을 더하지 바이어스를 표류시키지 않는다. random_walk 까지
# 부풀리면 필터가 바이어스 추정을 필요 이상으로 헤매게 둔다.
#
# 이 계수는 가정이다 (실측 아님)
# ------------------------------
# 실측 대비 사양: 자이로 1.08배, 가속도 0.52배로 데이터시트 수준이다.
# 실제 배수는 이 로봇의 기계적 결합에 달렸고 3 분이면 잴 수 있다:
#   1. 정지 녹화 (이 파일의 출처)
#   2. 바닥에서 제자리 회전시키며 녹화 (병진 거의 없음, 부하는 실제와 동일)
#   3. 두 잡음의 비 -> 이 계수를 실측으로 대체하고 measured: true 로
vio_inflation:
  noise_density_factor: 3.0     # 가정. 위 2~3 을 재서 확정할 것
  random_walk_factor: 1.0       # 진동은 바이어스 표류를 만들지 않는다
  measured: false
