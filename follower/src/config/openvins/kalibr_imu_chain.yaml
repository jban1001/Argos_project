# scripts/22_make_openvins_config.py 가 생성 -- 2026-08-28 22:45:44 KST
#
# 노이즈 밀도는 60초 정지 기록의 Allan 편차에서 측정했다 (여섯 축 모두
# 기울기 -0.50 근처, 자이로는 MPU6050 사양과 6% 이내 일치).
# random walk 는 +1/2 점근선이 나타나지 않아 데이터에서 구한 상한이다.
# 필터 입장에서 과대평가는 안전한 방향이다 -- IMU 를 덜 신뢰하고 시각
# 관측에 더 의존할 뿐이다.

