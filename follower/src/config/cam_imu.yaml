# === 주의: IMU 재고정(2026-08-28) 이후 재측정하지 못했다 ===
#
# 글루건으로 IMU 를 원래 자리 가깝게 다시 붙였다. 그 뒤 중력 벡터를 비교하니
# 3.51 도 변했다 (잡음 하한 0.113 도의 31 배). 다만 중력만으로는 "IMU 가
# 로봇에 대해 돌았다" 와 "로봇이 다른 기울기에 앉아 있다" 를 구분하지 못한다.
#
# 재측정을 시도했으나 이 방에서는 잔차가 20~35% 로, 아래 저장된 값(세 세션
# 평균, 실질 3~4 도)보다 나쁘다. 병진 오염률이 r/Z 인데 이 방은 Z 가 1~1.5 m
# 라 한계가 13% 다. 카메라 가까이 잡아 r 을 줄이려 하면 무거운 몸통의 관성을
# 팔이 붙잡느라 손이 흔들려 오히려 나빠진다.
#
# 그래서 아래 값을 그대로 쓰되, **최대 3.5 도가 더 얹혀 있을 수 있다**고 본다.
#
# 영향
#   OpenVINS  calib_cam_extrinsics: true 가 온라인으로 다듬는다
#   ArUco 연쇄 T_F_C  온라인 보정 없음. 카메라 위치(base_link 에서 0.31 m)
#                     에서 3.5 도면 약 2 cm 오차가 남는다
#
# 언제 고치나
#   2층 복도로 옮긴 뒤 거기서 재측정한다. Z 를 10 m 로 잡으면 몸통을 평범하게
#   잡아도 오염률이 2% 가 된다 -- 기술을 바꾸는 것보다 장소가 훨씬 크다.
#   그때 scripts/18 -> scripts/19 -> scripts/22 순서로 다시 하고 이 블록을 지운다.

# Camera <-> IMU extrinsic.
#
# 회전: scripts/18_estimate_cam_imu_rotation.py 로 측정 (measured).
#   영상의 회전 광학흐름에서 w_cam 을, 자이로에서 w_imu 를 얻어
#   w_cam = R_cam_imu * w_imu 를 Procrustes 로 풀었습니다. 회전 흐름은
#   장면 깊이에 의존하지 않지만 병진은 관측하지 못합니다.
#   세 세션의 회전 평균이다 (chordal L2 mean: 산술평균 후 SO(3) 투영).
#
#     회  쌍       오프셋   잔차    90도차   pitch/yaw/roll 커버리지
#      1  101/134  -24 ms  21.9%   8.61도   0.45 / 0.57 / 0.28
#      2  136/183  -28 ms  20.5%   9.18도   0.58 / 0.46 / 0.28
#      3   91/123  -26 ms  13.4%   7.50도   0.45 / 0.49 / 0.28
#
#   왜 3 회를 그냥 쓰지 않았나: 3 회가 셋 중 이상치다. 1-2 는 서로 0.86 도로
#   맞는데 3 회는 두 회 모두에서 3.3~3.9 도 떨어져 있다. 잔차가 가장 낮다는
#   이유로 채택됐지만, 그 잔차는 쌍의 26% 를 버리고 남은 것에 대한 값이다.
#   적합 지표가 좋은 것과 정확한 것은 다르다.
#
#   평균에서 각 세션까지: 0.94 / 1.52 / 2.38 도,  RMS 1.72 도
#   평균의 표준오차 (RMS/sqrt3): 약 1.0 도
#   평균 회전의 90도 배수와의 차이: 8.28 도
#
#   ** 한계 ** 위 1.0 도는 무작위 성분에만 해당한다. 세 세션 모두 roll
#   커버리지가 정확히 0.28(합격선)로 끝났는데, 이는 스크립트가 합격선에
#   닿는 순간 종료했기 때문이다. roll 방향 오차는 세 번 모두 같은 방향으로
#   남아 있을 수 있고 평균으로 지워지지 않는다. 실질 불확실성은 3~4 도로
#   보고 OpenVINS 의 calib_cam_extrinsics 를 반드시 켤 것.
#   (18 번의 종료 목표를 0.40 으로 올려 두었으므로 다음 측정은 나아진다.)
#
# 병진: 자로 잰 값입니다. 몇 mm 오차를 가정하고, OpenVINS 에서
#   calib_cam_extrinsics 를 켜서 온라인으로 다듬게 하세요.
#
# T_imu_cam: IMU 프레임에서 본 카메라 프레임
#   translation: m, IMU 원점 -> 카메라 광학 중심
#   rotation_xyzw: IMU 프레임 -> 카메라 광학 프레임
# 카메라 광학 프레임 규약: z 전방, x 우, y 하
# generated: 2026-08-27 18:59:47 KST

calibrated: true    # 아래 주의 참고: IMU 재고정 후 재측정 못함, 최대 3.5도 추가 오차
method: optical-flow-rotation + ruler-translation
rotation_measured: true-averaged-over-3-sessions
translation_measured: hand-robot-frame (forward 13.5cm, right 0cm, up 19cm)

T_imu_cam:
  translation: [0.0066, 0.1348, 0.1900]
  rotation_xyzw: [-0.685516, -0.042295, -0.051457, 0.725004]

# 초 단위. t_imu = t_cam + timeshift_cam_imu.
# 세 세션에서 -24 / -28 / -26 ms 가 나왔고 그 평균이 -26 ms 다. 회전과 달리
# 이 값은 세션 간 퍼짐이 4 ms 뿐이라 일관적이다.
# 위 회전 적합의 잔차를 최소화하는 오프셋으로 측정했습니다. 브리지가
# 전송 지터는 제거했지만 상수 지연(최소 시리얼 지연 + MPU6050 DLPF
# 군지연 약 5 ms)은 남아 있고, 그것이 이 값입니다.
timeshift_cam_imu: -0.0260
