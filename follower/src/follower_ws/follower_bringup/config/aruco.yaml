# === PROVISIONAL: 2지점만으로 채움 (2026-08-29) ===
# d0.3 검출 0, d0.5 참거리 0.304 m 21프레임. 품질 지표(재투영 0.94 px,
# 지터 8.6 mm, flip 0%)는 믿을 만하나 검출률 5.8% 는 마커가 화각을
# 드나든 결과로 본다. max_distance_m 은 실측이 아니라 겉보기 픽셀
# (56.6/d) 로 외삽했다. 26번 스크립트를 제대로 돌리면 갱신할 것.
# ArUco 검출 게이팅 임계값.
#
# <CONFIGURE> 인 값은 아직 측정되지 않았다. 지어내지 않는다 --
# scripts/26_characterize_aruco.py 로 실측한 뒤 채운다. 노드는 <CONFIGURE> 가
# 남아 있으면 기동을 거부한다. 짐작한 임계값은 두 방향으로 실패하는데
# (빡빡하면 멀쩡한 관측을 버려 LOST 가 잦고, 헐거우면 틀린 pose 를 믿어
# map->odom 보정이 튄다) 사후에 어느 쪽인지 구분되지 않기 때문이다.
/follower/aruco_pose:
  ros__parameters:
    # --- 확인된 값 ---------------------------------------------------------
    marker_id: 5
    marker_size_m: 0.115
    dictionary: DICT_4X4_50

    # --- 실측 필요 ---------------------------------------------------------
    # 재투영 오차 한계 [px]. 검출이 잘 되는 지점들의 p95 최대값에 여유를 곱해
    # 정한다. 26 번 스크립트의 --report 가 후보를 제시한다.
    max_reprojection_px: 3.0

    # 이 거리 밖의 관측은 버린다 [m]. 마커 겉보기 크기가 작아지면 모서리
    # 위치 오차가 각도 오차로 증폭된다. 검출률이 떨어지기 시작하는 거리를
    # 26 번으로 찾아서 넣는다.
    # 1.50 이었는데 추종거리 1.0 m 에 여유가 0.5 m 뿐이라, 메인 로봇이
    # 앞서기만 하면 마커가 기각되어 팔로워가 멈췄다 (2026-08-29 실측).
    # 겉보기 픽셀 모델(56.6/d)로 셀당 5 px 가 되는 거리가 1.89 m 이고,
    # 재투영 게이트가 이미 나쁜 관측을 거르므로 여기서 이중으로 막을 이유가
    # 없다. 놓치면 추종이 끊기고, 나쁜 관측은 재투영이 잡는다.
    max_distance_m: 2.50

    # 너무 가까우면 마커가 화각을 벗어나거나 초점이 안 맞는다 [m].
    min_distance_m: 0.25

    # 위치 공분산 [m^2]. 정지 상태 지터에서 나온다. 거리에 따라 커지므로
    # 26 번의 지터를 거리로 회귀해서 정한다.
    position_variance_m2: 0.0100

    # --- 모호성에 대한 주의 -------------------------------------------------
    # 모호성비로 프레임을 버리는 게이팅은 여기 없다. 팔로워가 마커 정면에서
    # 따라가므로 그 비가 늘 1 에 가깝고 (합성 실측: 0 도에서 0.998), 그렇게
    # 게이팅하면 관측을 전부 버리게 된다. 대신 두 해를 모두 발행하고,
    # 협조 위치추정이 메인 로봇 AMCL 자세로 맞는 쪽을 고른다.
    # 거리 보정 [m]. 줄자 0.50 m 에서 0.304 m 로 나왔다 (편차 -196 mm).
    # 보정 없이 두면 팔로워가 실제보다 가깝다고 믿어 덜 가고, 뒤처지다
    # 마커를 놓친다. 두 번째 거리에서 한 번 더 재면 더하는 보정이 맞는지
    # 곱하는 보정이 맞는지 갈린다.
    range_bias_m: 0.196

    publish_alternative: true
