# 추종 제어.
#
# 여기에는 성격이 다른 세 종류가 섞여 있다. 섞어 두면 "이 값은 재야 하는가,
# 정하는 것인가, 맞춰가는 것인가" 를 나중에 구분할 수 없다.
#
#   [하드웨어]  로봇이 그렇게 생겨서 정해진 값. 바꾸면 고장난다.
#   [선택]      우리가 정한 값. 다른 값도 맞다.
#   [튜닝]      로봇을 굴리면서 맞춰가는 값. 아래 값은 출발점일 뿐이다.
#
# 물리 측정값(<CONFIGURE> 로 막는 것) 은 여기 없다. 제어 게인은 참값이 있는
# 양이 아니라 고르는 양이므로, 재지 않았다고 기동을 막는 것은 맞지 않다.
/follower/follow_controller:
  ros__parameters:
    # --- 안전 -------------------------------------------------------------
    # [선택] 기본은 발행하지 않는다. 명령 문자열을 로그로만 낸다.
    # 실제로 바퀴를 돌릴 준비가 됐을 때만 true 로 켤 것.
    publish_commands: false

    # [하드웨어] MCU 가 받는 범위. 시리얼 브리지가 한 번 더 검사한다.
    max_throttle_limit: 180
    max_yaw_rate_limit_dps: 90.0

    # [선택] 실제로 낼 상한. 하드웨어 한계보다 낮게 시작한다 -- 처음부터
    # 180 을 주면 게인이 조금만 커도 벽으로 간다.
    # 펌웨어의 F/B 가 쓰는 값과 맞춘다. followingbot_mega.ino:
    #     F -> setCommand(150, 0.0, 800),  L/R -> setCommand(140, +-20, 1000)
    # 이 로봇이 실제로 굴러가는 것이 확인된 값은 그쪽이다.
    max_throttle: 160
    # 궤도 정지 마찰을 깨는 값. 45/55/65 로 올려봤지만 전부 모터가 울기만
    # 하고 안 굴렀다 (2026-08-29 실측). 펌웨어의 F 가 150 을 쓰고 그것이
    # 실제로 도는 것이 확인됐으므로, 하한은 그 근처여야 한다.
    min_throttle: 140
    # 주행 중 yaw 가 크면 펌웨어의 차동이 한쪽 궤도를 못 도는 PWM 까지
    # 떨어뜨린다. throttle 140 에서 turnCorrection 이 50 을 넘으면 느린 쪽이
    # 90 아래로 내려간다. turnCorrection = 2.0*yaw + 커브FF(최대 40) 이므로
    # yaw 12 deg/s 가 상한이다. 크게 틀어진 경우는 제자리 회전이 처리한다.
    max_yaw_rate_dps: 12.0

    # --- 추종 기하 ---------------------------------------------------------
    # [선택] 메인 로봇 뒤 얼마를 따라갈 것인가 [m].
    follow_distance_m: 1.0
    # [선택] 궤적 보관 길이와 최소 간격 [m].
    history_length_m: 10.0
    min_spacing_m: 0.02
    min_history_m: 0.15

    # --- 제어 게인 ---------------------------------------------------------
    # [튜닝] 목표가 이 안에 들면 정지. 너무 작으면 목표 주변에서 떤다.
    distance_deadband_m: 0.15
    # [튜닝] 이 안의 각도 오차는 무시한다.
    angle_deadband_deg: 5.0
    # [튜닝] 각도 오차 1 도당 회전 명령 [deg/s].
    # 방위 20 도(제자리 회전 문턱)에서 yaw 10 deg/s 가 되도록 잡았다.
    steering_gain_dps_per_deg: 0.5
    # [튜닝] 거리 1 m 당 throttle 증가분.
    throttle_gain_per_m: 60.0

    # --- 제어 주기 ---------------------------------------------------------
    # [하드웨어] MCU 에 350 ms 타임아웃, 브리지에 0.5 s 워치독이 있으므로
    # 계속 보내야 한다. 20 Hz 면 여유가 충분하다.
    control_rate_hz: 20.0

    # --- 프레임 -------------------------------------------------------------
    map_frame: map
    base_frame: follower_base_link
