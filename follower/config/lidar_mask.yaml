# 팔로워 차체 기둥 마스크 -- 측정값 단일 출처
#
# lidar_mask.py 와 tools/mask_verify.py 가 둘 다 이 파일을 읽는다.
# 값을 두 군데 두지 않는다 -- follower_ws/README.md 8 절의
# "값이 두 군데면 한쪽이 조용히 이긴다" 와 같은 이유다.
#
# 출처: tools/measure_pillars.py, 2026-08-31, 300 scans (약 30 초)
#       원시 데이터 bags/pillar_measure_20260831_030220.npz
#
# 2026-08-31 재측정 이유: +42~+45 deg 에서 기둥 거리(0.164 m) 반사가 마스크
# 밖으로 새어 나왔다. 기둥 두 개의 방위를 08-30 값과 비교하니 오른쪽은
# +0.82 deg, 왼쪽은 +4.49 deg 움직였다. 라이다가 마운트에서 돌았다면 둘이
# 같은 양만큼 밀려야 하므로, 라이다가 아니라 **왼쪽 기둥이 물리적으로
# 돌아간 것**이다. 그래서 extrinsic(yaw -2.77 deg)은 그대로 두고 마스크만
# 갱신했다. 왼쪽 기둥이 헐거우면 또 움직인다 -- 마스크가 새면 여기를 볼 것.
#
# 왜 거리 조건이 필요한가:
#   기둥은 LDS-02 광학 최소거리(약 0.16 m)에 걸쳐 있어서 스캔의 8~11% 에서
#   반사가 없다. 각도만 보고 자르면 그 프레임에서는 기둥 대신 그 방위의
#   배경(0.93~1.5 m)을 지운다. 실제로 그렇게 지워지는 것을 확인했다.
#   거리 조건을 같이 걸면 기둥이 없는 프레임에서는 아무것도 안 지운다.
#
#   그리고 거리 조건이 있으면 각도 구간을 넉넉히 넓혀도 대가가 없다.
#   전에는 구간을 좁게 잡아야 배경 손실이 적었고, 그래서 기둥이 샜다.

# 이 거리보다 가까운 점만 지운다.
#   기둥 최대 0.170 m,  같은 방위의 배경 최소 1.152 m
#   기하평균 0.443 m -> 양쪽으로 x2.60 여유
max_range_m: 0.443

# 각도 구간 (deg). 300 스캔에서 관측된 극단값 + 여유 1.5 도.
#   여유가 필요한 이유: LDS-02 는 스캔마다 빔 격자가 밀린다.
#   increment 가 1.691~1.723 deg 사이에서 변하는 것을 확인했다.
sectors:
  - name: right_pillar
    start_deg: -44.90        # 관측 -43.40
    end_deg:   -36.57        # 관측 -38.07
    observed_range_m: [0.158, 0.166]
    seen_in_scans: 0.97
  - name: left_pillar
    start_deg:  38.39        # 관측 +39.89
    end_deg:    46.17        # 관측 +44.67
    observed_range_m: [0.163, 0.170]
    seen_in_scans: 0.94
